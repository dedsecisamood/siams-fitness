<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siam's Fitness</title>
<style>
/* Layout idea: Apple Fitness-style personal hub. Three activity rings (Train, Protein, Habits) anchor Today; every other view is a calm stack of white cards on a soft grey canvas. */
:root{
--bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f5; --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08);
--chip:rgba(118,118,128,.12); --accent:#0071e3; --accent-ink:#ffffff;
--train:#f2104d; --protein:#2fb84a; --habit:#0a9fe6; --pad:#d9d9df; --body:#ececf0; --muscle:#d3d3da; --line-strong:rgba(0,0,0,.16);
--good:#248a3d; --good-bg:rgba(52,199,89,.12); --bad:#d70015; --bad-bg:rgba(255,59,48,.09); --warn:#b25000; --warn-bg:rgba(255,149,0,.12);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
--display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
--radius:22px; --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05);
color-scheme:light;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
--bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.10);
--chip:rgba(118,118,128,.24); --accent:#2997ff; --accent-ink:#ffffff;
--train:#fa114f; --protein:#9be52f; --habit:#1ed8f5; --pad:#48484a; --body:#2c2c2e; --muscle:#3f3f43; --line-strong:rgba(255,255,255,.2);
--good:#30d158; --good-bg:rgba(48,209,88,.14); --bad:#ff453a; --bad-bg:rgba(255,69,58,.14); --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.14);
--shadow:none; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --ink:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.10);
--chip:rgba(118,118,128,.24); --accent:#2997ff; --accent-ink:#ffffff;
--train:#fa114f; --protein:#9be52f; --habit:#1ed8f5; --pad:#48484a; --body:#2c2c2e; --muscle:#3f3f43; --line-strong:rgba(255,255,255,.2);
--good:#30d158; --good-bg:rgba(48,209,88,.14); --bad:#ff453a; --bad-bg:rgba(255,69,58,.14); --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.14);
--shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:110px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
/* Top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;color:var(--ink);text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:26px;height:26px}
.seg{display:flex;gap:2px;margin:0 auto;background:var(--chip);padding:3px;border-radius:999px}
.seg a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:550;transition:background .2s,color .2s}
.seg a:hover{color:var(--ink)}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"]::before{background:var(--good)}
.sync[data-s="connecting"]::before{background:var(--warn)}
.icon-btn{appearance:none;border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px}
/* Bottom tab bar (phones) */
.tabbar{display:none}
@media (max-width:1080px){
.seg{display:none}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:550;color:var(--muted);text-decoration:none;padding:4px 0}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent)}
.sync span{display:none}
}
/* Page */
main{max-width:1120px;margin:0 auto;padding:28px 20px 40px;display:grid;gap:20px}
.hero{display:grid;gap:6px;padding:8px 2px 4px}
.eyebrow{color:var(--muted);font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.07em}
.hero h1{font-size:clamp(34px,5.2vw,56px);line-height:1.04;font-weight:700;letter-spacing:-.028em}
.hero p.sub{color:var(--muted);font-size:clamp(16px,1.8vw,19px);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:22px;font-weight:650;margin-bottom:4px}
.card h3{font-size:17px;font-weight:650}
.card .lead{color:var(--muted);margin-bottom:16px;max-width:65ch}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head .lead{margin-bottom:0}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.span2{grid-column:1/-1}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
/* Buttons and chips */
.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 18px;border-radius:999px;cursor:pointer;transition:transform .15s ease,filter .2s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-size:15px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:0;background:var(--chip);color:var(--ink);padding:7px 13px;border-radius:999px;font-size:14px;font-weight:550;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--chip);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.acc{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.label{font-size:11px;font-weight:750;letter-spacing:.05em;padding:3px 8px;border-radius:6px;white-space:nowrap}
.l-ess{background:var(--good-bg);color:var(--good)}
.l-soon{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.l-opt{background:var(--chip);color:var(--muted)}
.l-skip{background:var(--warn-bg);color:var(--warn)}
.l-never{background:var(--bad-bg);color:var(--bad)}
/* Rings */
.rings-card{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
@media (max-width:520px){.rings-card{grid-template-columns:1fr;justify-items:center;text-align:center}}
.rings{width:190px;height:190px}
.rings circle{fill:none;stroke-linecap:round}
.ring-anim{animation:ringdraw 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringdraw{from{stroke-dashoffset:var(--from)}to{stroke-dashoffset:var(--to)}}
.legend{display:grid;gap:14px}
.legend .item{display:grid;gap:1px}
.legend .k{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.legend .v{font-family:var(--display);font-size:26px;font-weight:650;letter-spacing:-.02em}
.legend .v small{font-size:15px;color:var(--muted);font-weight:500}
.c-train{color:var(--train)} .c-protein{color:var(--protein)} .c-habit{color:var(--habit)}
/* Week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.wd b{font-size:13px;color:var(--ink);font-weight:650}
.wd .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.wd.done .dot{background:var(--train);border-color:var(--train);color:#fff}
.wd.rest .dot{border-style:dashed}
.wd.today{outline:2px solid var(--accent);outline-offset:-2px}
.wd .dot svg{width:14px;height:14px}
/* Lists */
.list{display:grid;gap:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .main b{font-weight:600}
.check{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;background:transparent;flex:none;transition:background .2s,border-color .2s,transform .15s}
.check svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff;animation:pop .3s ease}
.check[aria-pressed="true"] svg{opacity:1}
@keyframes pop{50%{transform:scale(1.18)}}
/* Water */
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;width:26px;height:32px;color:var(--habit)}
.glass svg{width:100%;height:100%}
.glass .fill{opacity:0;transition:opacity .25s}
.glass[aria-pressed="true"] .fill{opacity:1}
/* Bars */
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--protein);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.kcal i{background:var(--accent)}
.bar.over i{background:var(--warn)}
.metric{display:grid;gap:8px}
.metric .top-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric .big{font-family:var(--display);font-size:30px;font-weight:650;letter-spacing:-.02em}
.metric .big small{font-size:15px;color:var(--muted);font-weight:500}
/* Train */
.ex{display:grid;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0;padding-bottom:4px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.ex-head .main{flex:1;min-width:0}
.ex-head h3{font-size:18px}
.meta{color:var(--muted);font-size:14px}
.last{font-size:14px;color:var(--muted)}
.up{color:var(--good);font-weight:650}
.cue{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14.5px}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center}
.set .n{font-size:13px;color:var(--muted);font-weight:650;text-align:center}
.field{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:16px;font-variant-numeric:tabular-nums;min-width:0}
.field:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.set.done .field{border-color:color-mix(in srgb,var(--good) 40%,transparent)}
label.lbl{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.sticky-actions{position:sticky;bottom:86px;z-index:5;display:flex;justify-content:flex-end}
@media (min-width:1081px){.sticky-actions{bottom:20px}}
/* Timer */
.timer{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 14px;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.25);animation:slideup .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:1081px){.timer{bottom:28px}}
.timer[hidden]{display:none}
.timer .t{font-family:var(--display);font-size:22px;font-weight:650;min-width:58px;font-variant-numeric:tabular-nums}
.timer svg{width:30px;height:30px;transform:rotate(-90deg)}
.timer svg circle{fill:none;stroke-width:4}
.timer .tb{appearance:none;border:0;background:rgba(127,127,127,.28);color:inherit;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:650;cursor:pointer}
.timer.done{background:var(--good);color:#fff}
@keyframes slideup{from{transform:translate(-50%,20px);opacity:.3}}
/* Food */
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.food{appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px;transition:transform .15s,border-color .2s}
.food:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.food:active{transform:scale(.97)}
.food b{font-weight:600;font-size:15px}
.food span{font-size:12.5px;color:var(--muted)}
.food .pp{font-size:13px;font-weight:650;color:var(--protein)}
.food.red{border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.food.red .pp{color:var(--bad)}
.x{appearance:none;border:0;background:var(--chip);width:28px;height:28px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:12px;height:12px}
/* Recipes */
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.recipe{display:grid;gap:12px;align-content:start}
.recipe .bign{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--protein)}
.recipe .bign small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.recipe details summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
.recipe details summary::-webkit-details-marker{display:none}
.recipe details[open] summary{margin-bottom:10px}
.recipe ul,.recipe ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
.recipe h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 6px}
.tip{font-size:14px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.tile{background:var(--surface-2);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500}
.tile .d{font-size:13px;font-weight:600}
.tile .d.good{color:var(--good)} .tile .d.bad{color:var(--bad)}
/* Charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11.5px;font-family:var(--font)}
.chart .grid line{stroke:var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px;font-size:14.5px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,16px);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:16px;height:16px;border-radius:5px;background:var(--chip)}
.heat i.on{background:var(--train)}
.heat i.rest{background:transparent;border:1.5px dashed var(--line)}
.heat i.fut{background:transparent;border:1px solid var(--line)}
.heat-wrap{display:flex;gap:8px}
.heat-days{display:grid;grid-template-rows:repeat(7,16px);gap:4px;font-size:10.5px;color:var(--muted);line-height:16px}
/* Roadmap */
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.road{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.road{grid-template-columns:1fr}}
.phase{border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;align-content:start;background:var(--surface-2)}
.phase.now{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.phase ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.phase .gate{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.yearbar{position:relative;height:8px;border-radius:999px;background:var(--chip);margin:22px 0 8px}
.yearbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--habit),var(--accent));transition:width .9s}
.yearbar b{position:absolute;top:-24px;transform:translateX(-50%);font-size:12px;font-weight:650;white-space:nowrap;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:999px}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media (max-width:560px){.sched{grid-template-columns:repeat(4,1fr)}}
.sched div{background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:2px;font-size:13px}
.sched div b{font-size:15px}
.sched div.today{outline:2px solid var(--accent);outline-offset:-2px}
/* Flags */
.flags{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.flags{grid-template-columns:1fr}}
.flag{border-radius:18px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.flag.g{background:var(--good-bg)}
.flag.r{background:var(--bad-bg)}
.flag h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.flag.g h4{color:var(--good)} .flag.r h4{color:var(--bad)}
.flag ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px}
.flag li{display:grid;grid-template-columns:18px 1fr;gap:8px}
.flag li svg{width:16px;height:16px;margin-top:3px}
.flag.g li svg{color:var(--good)} .flag.r li svg{color:var(--bad)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:14px}
/* Coach note */
.coach{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.coach .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--train),var(--habit));display:grid;place-items:center;color:#fff;font-weight:700}
.note{border-radius:16px;padding:14px 16px;font-size:15px}
.note.good{background:var(--good-bg)} .note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)} .note.info{background:var(--surface-2)}
/* Modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:grid;gap:16px;animation:slideup2 .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup2{from{transform:translateY(16px);opacity:.4}}
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* Art + muscle map */
.art{width:100%;height:auto;display:block}
.art-l{font-size:11px;fill:var(--muted);font-family:var(--font)}
.art-box{background:var(--surface-2);border-radius:18px;padding:10px 14px}
.bodymap{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.legend-m{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;justify-content:center;margin-top:10px}
.legend-m i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--train);margin-right:6px;vertical-align:middle}
.legend-m i.s{opacity:.38}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--train) 12%,transparent);color:var(--train)}
.tag.s{background:var(--chip);color:var(--muted)}
.numlist{margin:0;padding:0;list-style:none;counter-reset:n;display:grid;gap:12px}
.numlist li{counter-increment:n;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font-size:15.5px}
.numlist li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:15px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.ex-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:760px){.ex-hero{grid-template-columns:1fr}}
.backlink{appearance:none;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:15px;text-decoration:none}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.lib a{text-decoration:none;color:inherit}
.lib .card{display:grid;gap:8px;padding:16px;transition:transform .2s,box-shadow .2s;height:100%}
.lib .card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.08)}
.lib .art{max-height:110px}
.lib h3{font-size:16px}
.ex-link{color:inherit;text-decoration:none}
.ex-link:hover{color:var(--accent)}
.found{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.found .item{border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:6px;background:var(--surface-2)}
.found .item.on{border-color:var(--good);background:var(--good-bg)}
.found .art{max-height:80px}
.found .row{justify-content:space-between}
/* Habits */
.habits{display:grid;gap:12px}
.habit{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.habit .hi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--habit) 14%,transparent);color:var(--habit)}
.habit .hi svg{width:22px;height:22px}
.habit.done .hi{background:var(--habit);color:#fff}
.habit h3{font-size:16.5px}
.habit .hcue{font-size:13.5px;color:var(--muted);margin-top:2px}
.habit .meta2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--chip)}
.dots i.d{background:var(--habit)}
.dots i.m{background:transparent;border:1.5px solid var(--bad)}
.dots i.n{background:transparent;border:1.5px dashed var(--line-strong)}
.dots i.t{background:transparent;border:1.5px solid var(--habit)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--warn)}
.streak svg{width:14px;height:14px}
.counter{display:flex;align-items:center;gap:6px}
.counter .cv{min-width:58px;text-align:center;font-family:var(--display);font-weight:650;font-size:18px;font-variant-numeric:tabular-nums}
.counter .cv small{display:block;font-size:11px;color:var(--muted);font-weight:500;font-family:var(--font)}
.round{appearance:none;border:0;width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.round:active{transform:scale(.92)}
.big-check{width:40px;height:40px}
.big-check svg{width:18px;height:18px}
.habit-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips .chip{min-width:46px;text-align:center}
.iconpick{display:flex;gap:6px;flex-wrap:wrap}
.iconpick .chip{width:40px;height:40px;padding:0;display:grid;place-items:center}
.iconpick svg{width:18px;height:18px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.hm i{aspect-ratio:1;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:10.5px;font-style:normal;color:var(--muted)}
.hm b{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:14px;background:var(--warn-bg);color:var(--ink);margin-top:10px}
.alert b{color:var(--warn)}
/* More menu */
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.more a{display:grid;gap:8px;padding:20px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.more a svg{width:28px;height:28px;color:var(--accent)}
.more a b{font-size:18px;font-family:var(--display)}
.more a span{color:var(--muted);font-size:14px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.gloss div{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14.5px}
.gloss b{display:block;margin-bottom:2px}
.visits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.visit{border-radius:18px;padding:16px;background:var(--surface-2);display:grid;gap:8px;align-content:start}
.visit .eyebrow{color:var(--accent)}
.pr{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font-weight:700;font-size:12.5px;padding:3px 10px;border-radius:999px}
/* Motion */
.anim > *{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.anim > *:nth-child(2){animation-delay:.05s}
.anim > *:nth-child(3){animation-delay:.1s}
.anim > *:nth-child(4){animation-delay:.15s}
.anim > *:nth-child(5){animation-delay:.2s}
.anim > *:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:.35;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function bodyOf(id){if(id==='settings')return S.settings;if(id==='body')return S.body;if(id==='habits')return S.habits||undefined;if(id.startsWith('w-'))return S.sessions[id.slice(2)];if(id.startsWith('d-'))return S.diet[id.slice(2)];return undefined}
function allIds(){return ['settings','body',...(S.habits?['habits']:[]),...Object.keys(S.sessions).map(k=>'w-'+k),...Object.keys(S.diet).map(k=>'d-'+k)]}
let coll=null, syncState='local';
const wq={}, wt={};
function setSync(s){syncState=s;const el=$('#sync');el.dataset.s=s;el.innerHTML='<span>'+({local:'On this device',connecting:'Connecting…',synced:'Synced',offline:'Offline, saved here'}[s]||'')+'</span>';el.title=el.textContent}
function persist(id){saveLocal();if(!coll)return;clearTimeout(wt[id]);wt[id]=setTimeout(()=>flush(id),650)}
async function flush(id){
const q=wq[id]||(wq[id]={busy:false,again:false});
if(q.busy){q.again=true;return}
q.busy=true;
try{const b=bodyOf(id);if(b===undefined)await coll.doc(id).delete();else await coll.doc(id).set(clone(b));setSync('synced')}
catch(e){
if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));q.busy=false;return flush(id)}
if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){coll=null;setSync('local')}else setSync('offline');
}
q.busy=false;if(q.again){q.again=false;flush(id)}
}
function applyDoc(id,data){
const before=bodyOf(id);
if(before!==undefined&&stable(before)===stable(data))return false;
if(id==='settings')S.settings=Object.assign(defaultSettings(),data);
else if(id==='body')S.body={entries:Array.isArray(data.entries)?data.entries:[]};
else if(id==='habits')S.habits={list:Array.isArray(data.list)?data.list:[]};
else if(id.startsWith('w-'))S.sessions[id.slice(2)]=data;
else if(id.startsWith('d-'))S.diet[id.slice(2)]=data;
else return false;
return true;
}

/* ---------- Plan math ---------- */
function startKey(){if(!S.settings.start){S.settings.start=todayKey();saveLocal()}return S.settings.start}
function weekNum(k=todayKey()){return Math.max(1,Math.floor(daysBetween(startKey(),k)/7)+1)}
function phaseOf(wk){return PHASES.find(p=>wk>=p.from&&wk<=p.to)||PHASES[3]}
function setsFor(ex,wk){const ph=phaseOf(wk).n;let s=2;if(ph>=2&&ex.main)s=3;if(ph>=3&&ex.lat)s=3;if(DELOADS.includes(wk))s=Math.max(1,Math.ceil(s/2));return s}
function kcalTarget(){return S.settings.kcal||phaseOf(weekNum()).kcal}

if(last&&daysBetween(last,k)<=7){const i=ORDER.indexOf(S.sessions[last].day);if(i>=0)return ORDER[(i+1)%6]}

function totals(k){const d=dayData(k);return (d.items||[]).reduce((a,i)=>({p:a.p+(+i.p||0),k:a.k+(+i.k||0)}),{p:0,k:0})}
function lastSetsFor(exKey,beforeKey){const ks=sessionKeys().filter(x=>x<beforeKey).reverse();for(const k of ks){const s=S.sessions[k].sets&&S.sessions[k].sets[exKey];if(s&&s.length)return {k,sets:s}}return null}
function weekStart(k){const d=parseKey(k);const off=(d.getDay()+1)%7;return addDays(k,-off)}
function sessionVolume(s){let v=0,n=0;Object.values(s.sets||{}).forEach(arr=>arr.forEach(x=>{n++;v+=(+x.w||0)*(+x.r||0)}));return {v,n}}
const e1=(w,r)=>(+w||0)*(1+(+r||0)/30);

function ensureHabits(){if(!S.habits)S.habits={list:clone(DEFAULT_HABITS)};return S.habits.list}
function hv(d,h){if(h.id==='water')return d.water||0;return d.habits?d.habits[h.id]:undefined}
function setHv(k,h,v){const d=ensureDay(k);if(h.id==='water')d.water=v;else d.habits[h.id]=v;persist('d-'+k)}
function hDone(k,h){const v=hv(dayData(k),h);return h.kind==='count'?(+v||0)>=(h.target||1):!!v}
const hStart=h=>h.created||startKey();
function hScheduled(h,k){return (h.days||[0,1,2,3,4,5,6]).includes(parseKey(k).getDay())&&k>=hStart(h)}
function habitStats(h){
const k=todayKey();let streak=0,miss=0;
for(let i=0;i<400;i++){const dk=addDays(k,-i);if(dk<hStart(h))break;if(!hScheduled(h,dk))continue;
if(hDone(dk,h)){streak++;miss=0}else{if(i===0)continue;miss++;if(miss>=2)break}}
let best=0,run=0,m2=0;
for(let i=365;i>=0;i--){const dk=addDays(k,-i);if(dk<hStart(h))continue;if(!hScheduled(h,dk))continue;
if(hDone(dk,h)){run++;m2=0;best=Math.max(best,run)}else{if(i===0)continue;m2++;if(m2>=2)run=0}}
let sched=0,done=0;for(let i=0;i<30;i++){const dk=addDays(k,-i);if(dk<hStart(h))break;if(!hScheduled(h,dk))continue;if(i===0&&!hDone(dk,h))continue;sched++;if(hDone(dk,h))done++}
let lastSched=null;for(let i=1;i<14;i++){const dk=addDays(k,-i);if(dk<hStart(h))break;if(hScheduled(h,dk)){lastSched=dk;break}}

function lineChart(raw,avg,opts={}){

let y0=Math.min(...ys),y1=Math.max(...ys);const padY=Math.max((y1-y0)*.15,opts.minPad||1);y0-=padY;y1+=padY;

'finish':()=>{
const sets={};let n=0;
Object.entries(draft.sets).forEach(([k,arr])=>{const ok=arr.filter(s=>num(s.w)!=null&&num(s.r)!=null).map(s=>({w:num(s.w),r:Math.round(num(s.r))}));if(ok.length){sets[k]=ok;n+=ok.length}});
if(!n){toast('Log at least one set first');return}
const date=draft.date,prs=[];
Object.entries(sets).forEach(([k,arr])=>{if(k==='assisted-pullup')return;const prev=bestBefore(k,date);const top=arr.reduce((a,s)=>e1(s.w,s.r)>e1(a.w,a.r)?s:a,arr[0]);if(prev>0&&e1(top.w,top.r)>prev+0.01)prs.push(`${EX_BY_KEY[k].n.split(' or ')[0]} ${fmt1(top.w)} kg × ${top.r}`)});
S.sessions[date]={day:draft.day,sets,note:draft.note||'',prs,at:Date.now()};persist('w-'+date);
draft=null;try{localStorage.removeItem(LSD)}catch(e){}
clearInterval(tInt);$('#timer').hidden=true;
toast(prs.length?`Saved with ${plural(prs.length,'new best')}. Great work.`:`Saved ${PROGRAM[S.sessions[date].day].name}: ${plural(n,'set')}. Eat protein and sleep well.`);
location.hash='#today';
},
'open-session':el=>{loadSessionToDraft(el.dataset.k);render(true);window.scrollTo(0,0)},
'del-session':el=>{if(!armed(el))return;const k=el.dataset.k;delete S.sessions[k];persist('w-'+k);if(draft&&draft.date===k){draft=null;try{localStorage.removeItem(LSD)}catch(e){}}toast('Session deleted');render(false)},
'add-body':()=>{const date=$('#bDate').value||todayKey(),w=num($('#bWeight').value),wa=num($('#bWaist').value);if(w==null&&wa==null){toast('Enter your weight or waist');return}if((w!=null&&(w<35||w>200))||(wa!=null&&(wa<50||wa>160))){toast('That number looks off. Check it and try again.');return}
const E=S.body.entries||(S.body.entries=[]);const ex=E.find(e=>e.date===date);if(ex){if(w!=null)ex.weight=w;if(wa!=null)ex.waist=wa}else E.push({date,weight:w,waist:wa});persist('body');toast('Check-in saved');render(false)},
'rm-body':el=>{S.body.entries=(S.body.entries||[]).filter(e=>e.date!==el.dataset.date);persist('body');render(false)},
'ck':el=>{const st=S.settings;if(el.dataset.scope==='day1'){st.checklist=st.checklist||{};st.checklist[el.dataset.id]=!st.checklist[el.dataset.id]}else{st.weekly=st.weekly||{};const wk=weekStart(todayKey());const keep={};keep[wk]=st.weekly[wk]||{};keep[wk][el.dataset.id]=!keep[wk][el.dataset.id];st.weekly=keep}persist('settings');render(false)},
'found':el=>{const st=S.settings;st.found=st.found||{};st.found[el.dataset.eq]=!st.found[el.dataset.eq];persist('settings');if(st.found[el.dataset.eq])toast('Found: '+EQUIP[el.dataset.eq].n);render(false)},
'bag':el=>{const st=S.settings;st.bag=st.bag||{};st.bag[el.dataset.id]=!st.bag[el.dataset.id];persist('settings');render(false)},
'lib-day':el=>{libDay=el.dataset.d;render(false)},
'back':()=>{location.hash='#'+(navFrom&&navFrom!=='ex'&&navFrom!=='today'?navFrom:'exercises')},
'settings':()=>openSettings()
};
$('#view').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const fn=ACT[t.dataset.act];if(!fn)return;if(t.tagName!=='A')e.preventDefault();else if(t.dataset.act==='settings')e.preventDefault();fn(t,e)});
$('#view').addEventListener('input',e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
const refocus=(id)=>{const pos=t.selectionStart;render(false);const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}};
if(k==='w'||k==='r'){draft.sets[t.dataset.ex][+t.dataset.i][k]=t.value;saveDraft()}
else if(k==='note'){draft.note=t.value;saveDraft()}
else if(k==='food-q'){foodQuery=t.value;refocus('foodSearch')}
else if(k==='lib-q'){libQuery=t.value;refocus('libSearch')}
else if(k==='hf-name')habitEdit.name=t.value;
else if(k==='hf-target')habitEdit.target=t.value;
else if(k==='hf-unit')habitEdit.unit=t.value;
else if(k==='hf-cue')habitEdit.cue=t.value;
});
$('#view').addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.in==='ex-pick'){strengthEx=t.value;render(false)}else if(t.dataset.in==='lib-m'){libMuscle=t.value;render(false)}});
/* ---------- Settings ---------- */
function openSettings(){$('#setStart').value=startKey();$('#setProtein').value=proteinTarget();$('#setKcal').value=S.settings.kcal||'';$('#importBox').value='';$('#modal').hidden=false;$('#setStart').focus()}
$('#openSettings').addEventListener('click',openSettings);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))$('#modal').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)$('#modal').hidden=true});
$('#saveSettings').addEventListener('click',()=>{const st=$('#setStart').value;if(st)S.settings.start=st;const p=num($('#setProtein').value);if(p)S.settings.protein=clamp(Math.round(p),60,300);const kc=num($('#setKcal').value);S.settings.kcal=kc?clamp(Math.round(kc),1200,5000):null;persist('settings');$('#modal').hidden=true;toast('Settings saved');render(false)});
$('#copyData').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Copied. Paste it into a note to keep it safe.')}catch(e){const b=$('#importBox');b.value=JSON.stringify(S);b.select();toast('Select and copy the text in the box')}});
$('#importData').addEventListener('click',()=>{try{const o=JSON.parse($('#importBox').value);if(!o||typeof o!=='object'||!o.settings)throw 0;S.settings=Object.assign(defaultSettings(),o.settings);S.body=o.body||{entries:[]};S.sessions=o.sessions||{};S.diet=o.diet||{};S.habits=o.habits||null;allIds().forEach(id=>persist(id));$('#modal').hidden=true;toast('Backup restored');render(true)}catch(e){toast('That doesn’t look like a backup from this page')}});
/* ---------- Boot ---------- */
loadLocal();
startKey();
window.addEventListener('hashchange',route);
route();
initCloud();
</script>
